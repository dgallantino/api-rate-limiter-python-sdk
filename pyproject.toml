[project]
name = "api-rate-limiter"
version = "0.1.0"
description = "Python ASGI/WSGI client for the api-rate-limiter Check service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["grpcio", "protobuf"]

[project.urls]
Homepage = "https://github.com/dgallantino/api-rate-limiter"

[project.optional-dependencies]
dev = [
  "grpcio-tools",
  "pytest",
  "httpx",
  "starlette",
  "flask",
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "gen"]

[tool.pytest.ini_options]
pythonpath = ["src", "gen"]
testpaths = ["tests"]
